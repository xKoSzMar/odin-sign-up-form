<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Sign-up Form</title>
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <div id="main">
      <div id="baner">
        <div id="logo">
          <img
            src="https://cdn.statically.io/gh/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
            alt="odin_logo"
            width="100px"
          />
          <h1>ODIN</h1>
        </div>
        <p>
          Photo by
          <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
            >Unsplash</a
          >
        </p>
      </div>
      <div id="form">
        <div>
          <p class="bold greater">
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams.
          </p>
          <p class="bold greater">Sign up now to get started.</p>
        </div>
        <p class="bold greater">You know you want to.</p>
        <form action="./index.html" method="post" id="sign_up_form">
          <p class="bold greater">Let's do this!</p>
          <div class="form_row">
            <div>
              <label for="first_name">FIRST NAME</label>
              <input type="text" id="first_name" name="first_name" required />
            </div>
            <div>
              <label for="last_name">LAST NAME</label>
              <input type="text" id="last_name" name="last_name" required />
            </div>
          </div>
          <div class="form_row">
            <div>
              <label for="email">EMAIL</label>
              <input
                type="email"
                id="email"
                name="email"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
                required
              />
            </div>
            <div>
              <label for="phone">PHONE NUMBER</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                minlength="7"
                required
              />
            </div>
          </div>
          <div class="form_row">
            <div>
              <label for="password">PASSWORD</label>
              <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
              />
            </div>
            <div>
              <label for="c_password">CONFIRM PASSWORD</label>
              <input
                type="password"
                id="c_password"
                name="c_password"
                minlength="8"
                required
              />
            </div>
          </div>
        </form>
        <button type="submit" form="sign_up_form">Create Account</button>
        <p>Already have an account? <a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
